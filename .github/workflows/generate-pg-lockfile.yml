name: Generate PostgreSQL Lockfile

on:
  push:
    branches:
      - feat/postgres-storage-foundation

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/postgres-storage-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Generate synchronized PostgreSQL dependency lockfile
        run: npm install pg@8.23.0 --save --package-lock-only
      - name: Verify clean install from generated lockfile
        run: npm ci
      - name: Commit synchronized manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required"
            exit 0
          fi
          git commit -m "build: sync postgres driver lockfile"
          git push origin HEAD:feat/postgres-storage-foundation
